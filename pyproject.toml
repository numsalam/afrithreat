[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "afrithreat"
version = "0.1.0"
description = "African honeypot network & threat intelligence — pure Python, zero dependencies"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{name = "Numsalam (NUMAWARE)"}]
keywords = ["honeypot", "threat-intelligence", "security", "africa", "numaware"]

[project.scripts]
afrithreat = "afrithreat.cli:main"

[tool.setuptools.packages.find]
include = ["afrithreat*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
